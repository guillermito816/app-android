<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar APK</title>
</head>
<body>
    <h1 style="color:  #ADD8E6; brackground: #00008B; text-align: center;" >Generar su APK personalizado</h1>
    <form id="apkForm">
        <label for="appName">Nombre de la Aplicación:</label><br></br>
        <input type="text" id="appName" name="appName" required><br><br>

        <label for="appLogo"  >Logo de la Aplicación:</label>
        <input  style ="border-radius: 5px; background: #00008B; color: #ADD8E6; padding: 30px; " type="file" id="appLogo" name="appLogo" accept="image/*" required ><br><br>

        <button type="submit" style="color: #5160f1 ; background:#111969; transition: width 2s; transition-timing-function: ease-in; border-radius: 5px; ">Generar APK</button>
    </form>

    <p id="statusMessage"></p>

    <script src="parametro.js"></script>
</body>
</html>

<script>
    document.getElementById("apkForm").addEventListener("submit", async function (e) {
      e.preventDefault(); // Prevenir recarga de página

      const formData = new FormData();
      const apkName = document.getElementById("apkName").value;
      const logoFile = document.getElementById("logoInput").files[0];

      formData.append("apkName", apkName);
      formData.append("logo", logoFile);

      const response = await fetch("generate_apk.php", {
        method: "POST",
        body: formData,
      });

      const blob = await response.blob();
      const downloadUrl = URL.createObjectURL(blob);

      // Crear enlace de descarga
      const a = document.createElement("a");
      a.href = downloadUrl;
      a.download = `${apkName}.apk`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
</script>
